# Deploy by hand (project.md §19.1, §15.3); every merge to main is deployed
# on its own by CI, so this is for rollbacks (a tag) and single roles.
# `all` runs deploy/release.sh; a role runs
# deploy/deploy.sh on the server, which migrates first, then updates the
# chosen pair one at a time (web, receivers), so the site and webhook
# intake never stop. `collector` updates only the collector standing by and
# switches collection to it, leaving the other on the previous build;
# `collector-switch` switches back to that one (the collector rollback:
# nothing is pulled, the tag is ignored).
#
# Needs the secrets DEPLOY_SSH_KEY and DEPLOY_KNOWN_HOSTS (the server's host
# key line), DEPLOY_HOST and DEPLOY_USER (secrets or variables), and the stack in
# the checkout named by the repository variable DEPLOY_DIR (default
# /srv/kick_tracker) on the server (deploy/README.md). `shadow`
# deploys the shadow collector (compose.shadow.yml) to DEPLOY_SHADOW_HOST
# (whose host key must be in DEPLOY_KNOWN_HOSTS too).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      role:
        description: What to deploy
        required: true
        type: choice
        options: [all, web, collector, collector-switch, receivers, migrate-only, shadow]
      tag:
        description: Image tag (empty for the latest main; a commit sha from main to roll back)
        required: false
        default: ""

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        env:
          ROLE: ${{ inputs.role }}
          TAG: ${{ inputs.tag }}
          # Hosts and user: secrets or plain variables, either works.
          TARGET: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER }}@${{ inputs.role == 'shadow' && (secrets.DEPLOY_SHADOW_HOST || vars.DEPLOY_SHADOW_HOST) || (secrets.DEPLOY_HOST || vars.DEPLOY_HOST) }}
          DIR: ${{ vars.DEPLOY_DIR || '/srv/kick_tracker' }}
        run: |
          # The tag is typed by hand: only a sha or a plain tag goes into the
          # command. Empty: deploy.sh takes the build of the commit it pulls.
          # (Docker's own tag rule: no leading dot or dash, at most 128.)
          [[ -z "$TAG" || "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          script=deploy/deploy.sh
          [ "$ROLE" = all ] && script=deploy/release.sh
          [[ "$DIR" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "DEPLOY_DIR must be an absolute path: $DIR" >&2; exit 1; }
          ssh "$TARGET" "cd '$DIR' && git pull --ff-only && ROLE=$ROLE TAG=$TAG IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,} $script"
