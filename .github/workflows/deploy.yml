# Deploy one role at a time (project.md §19.1, §15.3), by hand: runs
# deploy/deploy.sh on the server, which migrates first, then updates the
# chosen pair one at a time (web, collectors standby first, receivers), so
# the site, collection and webhook intake never stop.
#
# Needs the repository secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY and
# DEPLOY_KNOWN_HOSTS (the server's host key line), and the stack in
# /srv/kick_tracker/deploy on the server (deploy/README.md). `shadow`
# deploys the shadow collector (compose.shadow.yml) to DEPLOY_SHADOW_HOST
# (whose host key must be in DEPLOY_KNOWN_HOSTS too).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      role:
        description: What to deploy
        required: true
        type: choice
        options: [web, collector, receivers, migrate-only, shadow]
      tag:
        description: Image tag (a commit sha from main, or latest)
        required: true
        default: latest

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Deploy
        env:
          ROLE: ${{ inputs.role }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ inputs.role == 'shadow' && secrets.DEPLOY_SHADOW_HOST || secrets.DEPLOY_HOST }}
        run: |
          # The tag is typed by hand: only a sha or a plain tag goes into the command.
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad tag: $TAG" >&2; exit 1; }
          prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh "$TARGET" "cd /srv/kick_tracker && git pull --ff-only && ROLE=$ROLE APP_IMAGE=$prefix-app:$TAG RECEIVER_IMAGE=$prefix-receiver:$TAG deploy/deploy.sh"
