# Stage 2 (project.md §15.2): a backup receiver on a second VPS, another
# provider or region, with its own spool. It publishes to the main
# RabbitMQ over the private network (WireGuard or Tailscale: AMQP_URL in
# secrets/receiver.env points at the main VPS's private address, where
# compose.single.yml publishes 5672 when PRIVATE_IP is set). Cloudflare
# Load Balancing sends the webhook hostname here when the main VPS stops
# answering /health. Setup: deploy/README.md, "The backup receiver".
name: kicktracker-backup

services:
  # HTTPS with a Cloudflare Origin CA certificate (caddy/backup-receiver.caddy:
  # this machine can't pass an ACME challenge for a host Cloudflare routes
  # to the main VPS).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["443:443"]
    env_file: [secrets/stack.env]
    volumes:
      - ./caddy/backup-receiver.caddy:/etc/caddy/Caddyfile:ro
      - ./secrets/origin-cert.pem:/etc/caddy/origin-cert.pem:ro
      - ./secrets/origin-key.pem:/etc/caddy/origin-key.pem:ro
      - caddy_data:/data
      - caddy_config:/config

  receiver:
    image: ${RECEIVER_IMAGE:-ghcr.io/anisabdellatif/kicktracker-receiver:latest}
    restart: unless-stopped
    env_file: [secrets/receiver.env]
    environment: {RECEIVER_ID: "vps2/1"}
    volumes: [spool:/data]

volumes:
  caddy_data:
  caddy_config:
  spool:
