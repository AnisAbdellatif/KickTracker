# The shadow collector's database (project.md §10.5), on the shadow
# machine. The collector itself is Kamal's (deploy/kamal/shadow.yml,
# deployed with deploy/shadow.sh), on the same Docker network ("kamal",
# created by Kamal's first deploy or `docker network create kamal`), so
# it reaches this as `db`. The backup receiver needs nothing from here.
#
# The main VPS's backfill reads this database over the private network
# (SHADOW_DATABASE_URL, the backfill_reader user of shadow/readers.sql),
# on PRIVATE_IP (this machine's Tailscale address, in deploy/.env) only.
#
#   docker compose -f compose.shadow.yml up -d
name: kicktracker-shadow

services:
  db:
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    env_file: [secrets/shadow-db.env]
    shm_size: 512m
    volumes: [db:/var/lib/postgresql]
    ports: ["${PRIVATE_IP:?set PRIVATE_IP in deploy/.env}:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 60

volumes:
  db:

networks:
  default:
    name: kamal
    external: true
