# The deploy rehearsal (rehearsal/README.md): compose.single.yml's
# database, queue and Caddy as they run in production, on one development
# machine. Only what a laptop can't do differs: plain HTTP on
# 127.0.0.1:8080 instead of 80/443, backups to a local WAL-G store. The
# app's containers are Kamal's (deploy/kamal/*.rehearsal.yml adds the fake
# Kick's host).
services:
  caddy:
    profiles: !reset []
    ports: !override ["127.0.0.1:8080:80"]
  rabbitmq:
    ports: !reset []
  db:
    ports: !reset []
