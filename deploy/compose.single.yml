# Stage 1 (project.md §15.2): everything on one VPS.
#
#   Caddy ─► receiver-1 / receiver-2 (lb_policy first) ─► RabbitMQ ─► collector-a/b ─► db
#         └► web-a / web-b (by visitor address) ─────────────────────────────────────┘
#
# This file holds what isn't redeployed with the code: the database, the
# queue and the bundled Caddy. The app's containers (web, collectors,
# receivers) are Kamal's (deploy/kamal/*.yml), deployed with deploy-kit
# (deploy/release.sh), one of a pair at a time: the site, the collectors
# and webhook intake never stop for a deploy (§15.3).
#
# Everything is on Kamal's Docker network ("kamal", created before this
# stack starts: deploy/README.md), so the app reaches `db` and `rabbitmq`
# by name, and the bundled Caddy reaches web-a, web-b, receiver-1 and
# receiver-2 by their network aliases.
#
# Secrets come from env files decrypted from secrets/*.sops.env (see
# secrets/README.md), never from this file.
name: kicktracker

services:
  # HTTPS in front, for a VPS with no web server of its own: enabled with
  # COMPOSE_PROFILES=caddy in deploy/.env. A Caddy the host already runs
  # imports caddy/sites.caddy instead and reaches web and the receivers on
  # the loopback ports they publish (deploy/kamal/*.yml; README.md, "A Caddy
  # already on the host").
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: [secrets/stack.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites.caddy:/etc/caddy/sites.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:15672:15672" # management UI: over SSH tunnel only
      # AMQP for the stage 2 backup receiver (compose.backup-receiver.yml):
      # on the private network's address only (loopback until one is set),
      # never a public one. It carries the receiver user's password in
      # plain AMQP, so only over WireGuard/Tailscale (README.md, "The
      # backup receiver").
      - "${PRIVATE_IP:-127.0.0.1}:5672:5672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      # Generated from secrets by rabbitmq/make-prod-definitions.sh, never committed.
      - ./rabbitmq/definitions.prod.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.prod.conf:/etc/rabbitmq/conf.d/20-kicktracker.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30

  db:
    image: ${DB_IMAGE:-ghcr.io/anisabdellatif/kicktracker-db:latest}
    build: ./db
    restart: unless-stopped
    env_file: [secrets/db.env]
    shm_size: 1g
    volumes: [db:/var/lib/postgresql]
    # The shadow collector reads the channel list here (§10.5): publish on
    # the private network's address only (loopback until one is set).
    ports: ["${PRIVATE_IP:-127.0.0.1}:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 60

# The app's volumes (journals, spools, transfers) were created by this file
# as kicktracker_*; Kamal's containers use them under those names.
volumes:
  caddy_data:
  caddy_config:
  rabbitmq:
  db:

networks:
  default:
    name: kamal
    external: true
