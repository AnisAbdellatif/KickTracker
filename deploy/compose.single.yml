# Stage 1 (project.md §15.2): everything on one VPS.
#
#   Caddy ─► receiver-1 / receiver-2 (lb_policy first) ─► RabbitMQ ─► collector-a/b ─► db
#         └► web-a / web-b (by visitor address) ─────────────────────────────────────┘
#
# Each service is redeployed on its own, one of a pair at a time
# (deploy.sh): the site, the collectors and webhook intake never stop for
# a deploy (§15.3).
# Two collectors run; one collects, the other stands by and takes over in
# about a second on a deploy, or ~20s if the first dies (§10.1).
#
# Images are pinned in deploy/.env (APP_IMAGE, COLLECTOR_IMAGE; written by
# the deploy workflow): a plain `docker compose up -d` never swaps the
# collectors' image by accident.
# Secrets come from env files decrypted from secrets/*.sops.env (see
# secrets/README.md), never from this file. Images come from GHCR (§19.1).
name: kicktracker

x-app: &app
  image: ${APP_IMAGE:?pin APP_IMAGE in deploy/.env (deploy/README.md)}
  env_file: [secrets/app.env]
  restart: unless-stopped
  # Exports and imports: web takes uploads and serves downloads, the
  # collector does the work (TRANSFER_DIR, project.md §13.8).
  volumes: [transfers:/transfers]
  # Every app container answers to "app": how the nodes find each other
  # (DNS_CLUSTER_QUERY=app) and form one cluster for PubSub.
  networks: {default: {aliases: [app]}}
  depends_on:
    db: {condition: service_healthy}

# A collector: its own image pin and env file (no web secrets), its
# journal on its own volume, `always` restarted, and a minute to stop
# cleanly (stop collecting, release the lease, write out its journal).
x-collector: &collector
  image: ${COLLECTOR_IMAGE:?pin COLLECTOR_IMAGE in deploy/.env (deploy/README.md)}
  env_file: [secrets/collector.env]
  restart: always
  stop_grace_period: 60s
  networks: {default: {aliases: [app]}}
  depends_on:
    db: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}

x-receiver: &receiver
  image: ${RECEIVER_IMAGE:-ghcr.io/anisabdellatif/kicktracker-receiver:latest}
  env_file: [secrets/receiver.env]
  restart: unless-stopped

services:
  # HTTPS in front, for a VPS with no web server of its own: enabled with
  # COMPOSE_PROFILES=caddy in deploy/.env. A Caddy the host already runs
  # imports caddy/sites.caddy instead and reaches web and the receivers on
  # their loopback ports below (README.md, "A Caddy already on the host").
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: [secrets/stack.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/sites.caddy:/etc/caddy/sites.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

  # Each web node and receiver is also published on loopback, for a Caddy
  # running on the host (the ports are set in deploy/.env if taken).
  receiver-1:
    <<: *receiver
    environment: {RECEIVER_ID: "vps1/1"}
    volumes: [spool1:/data]
    ports: ["127.0.0.1:${RECEIVER_1_PORT:-4160}:4060"]

  receiver-2:
    <<: *receiver
    environment: {RECEIVER_ID: "vps1/2"}
    volumes: [spool2:/data]
    ports: ["127.0.0.1:${RECEIVER_2_PORT:-4161}:4060"]

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:15672:15672" # management UI: over SSH tunnel only
      # AMQP for the stage 2 backup receiver (compose.backup-receiver.yml):
      # on the private network's address only (loopback until one is set),
      # never a public one. It carries the receiver user's password in
      # plain AMQP, so only over WireGuard/Tailscale (README.md, "The
      # backup receiver").
      - "${PRIVATE_IP:-127.0.0.1}:5672:5672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
      # Generated from secrets by rabbitmq/make-prod-definitions.sh, never committed.
      - ./rabbitmq/definitions.prod.json:/etc/rabbitmq/definitions.json:ro
      - ./rabbitmq/rabbitmq.prod.conf:/etc/rabbitmq/conf.d/20-kicktracker.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30

  db:
    image: ${DB_IMAGE:-ghcr.io/anisabdellatif/kicktracker-db:latest}
    build: ./db
    restart: unless-stopped
    env_file: [secrets/db.env]
    shm_size: 1g
    volumes: [db:/var/lib/postgresql]
    # The shadow collector reads the channel list here (§10.5): publish on
    # the private network's address only (loopback until one is set).
    ports: ["${PRIVATE_IP:-127.0.0.1}:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 60

  collector-a:
    <<: *collector
    environment: {ROLE: collector, COLLECTOR_ID: collector-a}
    volumes: [journal-a:/journal, transfers:/transfers]

  collector-b:
    <<: *collector
    environment: {ROLE: collector, COLLECTOR_ID: collector-b}
    volumes: [journal-b:/journal, transfers:/transfers]

  # Two, behind Caddy: a site deploy updates one while the other serves.
  web-a:
    <<: *app
    environment: {ROLE: web}
    ports: ["127.0.0.1:${WEB_A_PORT:-4110}:4100"]

  web-b:
    <<: *app
    environment: {ROLE: web}
    ports: ["127.0.0.1:${WEB_B_PORT:-4111}:4100"]

  # Migrations are a step of their own, before a deploy (§19.1):
  #   docker compose run --rm migrate
  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    environment: {ROLE: web}
    command: ["/app/bin/migrate"]

volumes:
  journal-a:
  journal-b:
  caddy_data:
  caddy_config:
  transfers:
  spool1:
  spool2:
  rabbitmq:
  db:
