# Continuous archiving to object storage with WAL-G (project.md §18.1).
# WAL-G reads its target and credentials from the environment
# (WALG_S3_PREFIX + AWS_*, or WALG_FILE_PREFIX for a local test).
archive_mode = on
archive_command = 'wal-g wal-push %p'
# A WAL segment at least every minute, so at most a minute is lost.
archive_timeout = 60
wal_level = replica
max_wal_senders = 3
